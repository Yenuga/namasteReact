<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .grid-container {
        background-color: #b49f9f;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 200px 200px 200px;

        /* grid template rows */
        /* grid-template-columns: 200px 200px 200px 200px;
        grid-template-rows: 200px 400px;
        grid-template-areas:
          "box-1 box-2 box-2 box-3"
          "box-1 box-4 box-5 box-5"; */
        gap: 5px;
      }
      /* .menu {
        max-width: 50px;
      } */
      .item1 {
        background-color: blue;
        margin: 5px;
        /* display: flex;
        justify-content: center;
        align-items: center; */
        grid-column: 1 / 3;
        grid-row: 1 / 3;
      }
      .item2 {
        background-color: rgb(199, 44, 145);
        margin: 5px;
        /* display: flex;
        justify-content: center;
        align-items: center; */
        grid-column: 2/ 4;
        grid-row: 1 / 3;
        opacity: 0.5;
      }

      @media (max-width: 800px) {
        .grid-container {
          grid-template-columns: 100px 100px;
          grid-template-rows: 100px 100px 100px 100px;
          grid-template-areas: "box-1 box-2" "box-3 box-3" "box-3 box-3" "box-4 box-4";
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="root2"></div>
    <h1>This is My Root HTML File 🤩</h1>

    <div class="grid-container">
      <div class="item1">1</div>
      <div class="item2">2</div>
      <!-- <div class="item" style="grid-area: box-3">3</div> -->
      <!-- <div class="item" style="grid-area: box-4">4</div>
      <div class="item" style="grid-area: box-5">5</div> -->
    </div>

    <!-- <script type="module" src="./index.js"></script> -->
  </body>
</html>
